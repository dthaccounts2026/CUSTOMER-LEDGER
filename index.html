<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customer Ledger</title>

<style>
:root{
  --cover:#5C2069;
  --cover-dark:#3E1049;
  --paper:#FFFFFF;
  --paper-line:#E3E1E6;
  --ink:#1F1B24;
  --ink-soft:#7A7580;
  --gold:#8E44AD;
  --gold-bright:#B85FD1;
  --debit:#C0392B;
  --credit:#1F6B45;
  --shadow: 0 4px 14px rgba(0,0,0,0.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--cover);font-family:'Inter',sans-serif;color:var(--ink);}
body{min-height:100vh;}

/* ===== Responsive shell — full-bleed on phones, centered card on
   tablets/laptops/desktops so text and rows don't stretch edge to edge =====
   app-shell is its own flex column (for header/paper/footer stacking);
   centering of the whole card is done via plain block auto-margins on
   body's normal flow, which is unambiguous in every browser. */
.app-shell{width:100%; margin:0 auto; display:flex; flex-direction:column; min-height:100vh;}
@media (min-width:700px){
  html,body{background:var(--cover-dark);}
  .app-shell{
    width:620px; max-width:92vw; min-height:0; margin:24px auto 40px; border-radius:18px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
}
@media (min-width:1024px){
  .app-shell{width:680px; margin:36px auto 48px;}
}
@media (min-width:1280px){
  .app-shell{width:980px; margin:36px auto 48px;}
  .sheet{font-size:15.5px;}
  .sheet th{padding:12px 10px; font-size:14px;}
  .sheet td{padding:11px 10px;}
  body{font-size:16px;}
}
/* Modals/toasts stay full-viewport overlays but their content clamps too */
@media (min-width:700px){
  .overlay{align-items:center;}
  .sheet-modal{max-width:460px; margin:0 auto; border-radius:18px;}
}

/* Decorative ledger-themed symbols filling the empty margin around the
   centered card on tablet/laptop/desktop screens. Hidden on phones since
   there's no spare space there. */
.bg-symbols{display:none;}
@media (min-width:700px){
  .bg-symbols{
    display:block; position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-symbols span{ position:absolute; font-size:56px; opacity:.10; }
  .app-shell{position:relative; z-index:1;}
}

/* ===== Cover header ===== */
.cover{
  background: linear-gradient(160deg, var(--cover) 0%, var(--cover-dark) 100%);
  color:#F3E6D3;
  padding:18px 18px 26px;
  position:relative;
  box-shadow: var(--shadow);
}

.cover-top{display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:0;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-text h1{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; margin:0; letter-spacing:.2px;}
.brand-text small{font-size:10.5px; opacity:.75; letter-spacing:.5px;}
.status-dot{width:8px;height:8px;border-radius:50%; background:#7BC496; box-shadow:0 0 0 3px rgba(123,196,150,.25);}
.status-dot.off{background:#D97757; box-shadow:0 0 0 3px rgba(217,119,87,.25);}

.acct-row{margin-top:14px; display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
.acct-row::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:500;
  background:rgba(243,230,211,.12); color:#F3E6D3; border:1px solid rgba(243,230,211,.22);
  white-space:nowrap; cursor:pointer;
}
.chip.active{background:var(--gold-bright); color:var(--cover-dark); border-color:var(--gold-bright); font-weight:600;}

.balance-block{margin-top:20px; text-align:center;}
.balance-label{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; opacity:.7;}
.balance-num{font-family:'Fraunces',serif; font-weight:700; font-size:44px; line-height:1.15; margin-top:2px; letter-spacing:-1px;}
.balance-sub{font-size:11.5px; opacity:.7; margin-top:2px;}

/* ===== Paper body ===== */
.paper{background:var(--paper); flex:1; padding:20px 14px 90px; position:relative;}
.actions{display:flex; gap:10px; margin-bottom:16px;}
.btn{
  flex:1; padding:13px 0; border-radius:12px; border:none; font-size:15.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  font-family:'Inter',sans-serif;
}
.btn-debit{background:#E4E2E6; color:var(--ink);}
.btn-credit{background:#E4E2E6; color:var(--ink);}
.btn:active{transform: scale(0.98);}

.searchwrap{position:relative; margin-bottom:12px;}
.search{
  width:100%; padding:11px 40px 11px 14px; border-radius:10px; border:1px solid var(--paper-line);
  background:#fff; font-size:13.5px; font-family:'Inter',sans-serif; color:var(--ink);
}
.search:focus{outline:2px solid var(--gold-bright); outline-offset:1px;}
.hint{font-size:10.5px; color:var(--ink-soft); margin:-6px 0 12px 2px;}

.viewtoggle{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.viewtoggle::-webkit-scrollbar{display:none;}
.vt-btn{
  padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; border:1px solid var(--paper-line);
  background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.vt-btn.active{background:var(--cover); color:#F3E6D3; border-color:var(--cover);}

/* ledger list */
.entry{
  background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:9px;
  border:1px solid var(--paper-line); display:flex; justify-content:space-between; gap:10px;
  box-shadow: 0 1px 0 rgba(36,26,21,0.03);
}
.entry-left{min-width:0;}
.entry-id{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--gold); font-weight:600;}
.entry-name{font-size:14px; font-weight:600; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.entry-meta{font-size:11px; color:var(--ink-soft); margin-top:3px;}
.entry-right{text-align:right; flex:0 0 auto;}
.entry-amt{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
.entry-amt.debit{color:var(--debit);}
.entry-amt.credit{color:var(--credit);}
.entry-bal{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:3px;}

/* spreadsheet view */
.sheet{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; font-size:11.5px;}
.sheet th{background:var(--cover); color:#F3E6D3; padding:8px 6px; font-weight:600; text-align:left; position:sticky; top:0;}
.sheet td{padding:7px 6px; border-bottom:1px solid var(--paper-line); font-family:'JetBrains Mono',monospace;}
.sheet tr:nth-child(even){background:#FBF7EE;}
.sheet .d{color:var(--debit);} .sheet .c{color:var(--credit);}

.empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty b{display:block; color:var(--ink); font-family:'Fraunces',serif; font-size:17px; margin-bottom:6px;}

/* footer total bar */
.footbar{
  position:fixed; left:0; right:0; bottom:0; background:var(--cover); color:#F3E6D3;
  display:flex; padding:12px 16px; align-items:center; justify-content:space-between; box-shadow:0 -4px 16px rgba(0,0,0,.15);
}
.footbar .f-item{text-align:center; flex:1;}
.footbar .f-label{font-size:9.5px; opacity:.7; text-transform:uppercase; letter-spacing:.5px;}
.footbar .f-val{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13.5px; margin-top:2px;}
.footbar button{background:var(--gold-bright); border:none; color:var(--cover-dark); border-radius:9px; padding:9px 14px; font-weight:700; font-size:12px;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(36,26,21,.45); display:none; align-items:flex-end; z-index:50;}
.overlay.show{display:flex;}
.sheet-modal{
  background:var(--paper); width:100%; border-radius:18px 18px 0 0; padding:20px 18px 24px;
  max-height:88vh; overflow-y:auto;
}
.sheet-modal h2{font-family:'Fraunces',serif; margin:0 0 14px; font-size:19px;}
.field{margin-bottom:12px;}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
.field input, .field textarea{
  width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--paper-line);
  font-size:14.5px; font-family:'Inter',sans-serif; background:#fff;
}
.typetog{display:flex; gap:8px; margin-bottom:14px;}
.typetog button{
  flex:1; padding:11px 0; border-radius:9px; font-weight:700; font-size:14px; border:1.5px solid var(--paper-line); background:#fff; color:var(--ink-soft);
}
.typetog button.sel.debit{background:var(--debit); color:#fff; border-color:var(--debit);}
.typetog button.sel.credit{background:var(--credit); color:#fff; border-color:var(--credit);}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions button{flex:1; padding:13px; border-radius:10px; font-weight:700; font-size:14.5px; border:none;}
.mcancel{background:#fff; color:var(--ink-soft); border:1px solid var(--paper-line) !important;}
.msave{background:var(--cover); color:#F3E6D3;}

.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--ink); color:#F6EFDE;
  padding:9px 18px; border-radius:999px; font-size:12.5px; z-index:99; opacity:0; transition:opacity .25s;
}
.toast.show{opacity:1;}
</style>
</head>
<body>

<script>
/* ================= PWA: service worker ================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e));
  });
}

/* ================= CONFIG ================= */
// TODO: இங்க உங்க Supabase project-oda anon public key போடுங்க.
// URL already தெரியும் (dthaccounts2026 project), key மட்டும் fill பண்ணுங்க.
const SUPABASE_URL = "https://wricrnkkiqjaxgnnehvf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TfHbeEy7nTHg0CuwHGwx8Q_BSV5d09k";
const TABLE = "customer_ledger";

let sb = null;
try{
  if(SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf("PASTE_") !== 0){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.warn("Supabase init failed", e); }

const LS_KEY = "customer_ledger_entries_v1";
const PD_KEY = "customer_ledger_pending_deletes_v1";
let entries = [];       // {id, srcId, customer_name, phone, type, amount, note, created_at}
let editingSrcId = null; // set while the modal is editing an existing entry
let pendingDeletes = []; // srcIds queued for deletion once we're back online
let currentCustomer = "__ALL__";
let currentType = "credit";
let currentPayType = "cash";
let view = "list";

/* ================= STORAGE ================= */
function loadLocal(){
  try{ entries = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ entries = []; }
  try{ pendingDeletes = JSON.parse(localStorage.getItem(PD_KEY) || "[]"); }catch(e){ pendingDeletes = []; }
}
function saveLocal(){
  localStorage.setItem(LS_KEY, JSON.stringify(entries));
}
function savePendingDeletes(){
  localStorage.setItem(PD_KEY, JSON.stringify(pendingDeletes));
}

function uid(){
  return "cl_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
}

// helper: pick first non-empty value among possible field name variants
function pick(obj, keys){
  for(const k of keys){
    if(obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
  }
  return null;
}

// DTH Accounts dates are saved as 'DD/MM/YYYY' (en-IN locale) — convert to ISO
// so the ledger sorts/filters correctly alongside manual + Recharge Shop entries.
function dthDateToIso(dateStr){
  if(!dateStr) return new Date().toISOString();
  const parts = String(dateStr).split('/');
  if(parts.length === 3){
    const [d,m,y] = parts;
    const iso = new Date(Number(y), Number(m)-1, Number(d));
    if(!isNaN(iso.getTime())) return iso.toISOString();
  }
  return new Date().toISOString();
}

// Pull straight from DTH Accounts' own DTH_RECORDS table (id, type, data JSON,
// updated_at) — same table Credit Tracker reads. type='credit'/'cashpend' rows
// are still-owed right now → one 'credit' ledger entry. type='recharge' rows
// are every DTH sale — a paidDate means it was originally credit and later
// settled (credit + debit, two different dates); no paidDate means it was
// plain cash paid on the spot (credit + debit, same date, nets to zero).
// Either way both entries are emitted so the full sales history shows up
// here, not just the ones that were ever owed.
async function fetchDthRecords(){
  try{
    // Page through in batches of 1000 instead of a flat limit(2000) so
    // shops with a large sales history don't silently lose their oldest
    // records once the table crosses that cap.
    const data = [];
    const PAGE = 1000;
    for(let from = 0; ; from += PAGE){
      const { data: page, error } = await sb.from('DTH_RECORDS').select('id,type,data').range(from, from + PAGE - 1);
      if(error) throw error;
      if(!page || page.length === 0) break;
      data.push(...page);
      if(page.length < PAGE) break;
    }
    const out = [];
    data.forEach(row => {
      const r = row.data || {};
      const name = pick(r, ['cust','name','customer']) || 'Unknown';
      const phone = pick(r, ['mobile','phone']) || '';
      const dth_no = pick(r, ['dth','dthNo','dthNumber','smartcard']) || '';
      // Balance Held (advance) rows use `amount`, not incomeLKR/amt/cost — added
      // as a fallback here so they aren't silently dropped by the amt<=0 check
      // that every other row type below relies on.
      const amt = Number(pick(r, ['incomeLKR','amt','cost','amount']) || 0);
      if (amt <= 0) {
        console.warn('DTH_RECORDS: skipped row with zero/blank amount', { id: row.id, type: row.type, data: r });
        return;
      }
      const note = r.op ? (r.op + (r.dth ? ' #'+r.dth : '')) : 'DTH Recharge';
      if (row.type === 'credit' || row.type === 'cashpend') {
        out.push({
          id: 'dth_'+row.id+'_credit', srcId: null, readonly: true,
          customer_name: name, phone, dth_no, type: 'credit', amount: amt, note,
          source_app: 'DTH Accounts', payment_type: 'credit',
          created_at: dthDateToIso(r.date)
        });
      } else if (row.type === 'recharge') {
        // Every recharge sale now shows up here, not just ones that were
        // once credit. r.paidDate present → was credit, now settled (two
        // different dates, same as before). No paidDate → plain cash sale,
        // paid at the moment of sale, so both entries land on the same
        // created_at and the running balance nets straight back to zero —
        // it still appears in the history, it just never shows as owing.
        const paidTime = r.paidDate ? dthDateToIso(r.paidDate) : dthDateToIso(r.date);
        const settleNote = r.paidDate ? 'Credit Paid' : 'Cash Sale';
        out.push({
          id: 'dth_'+row.id+'_credit', srcId: null, readonly: true,
          customer_name: name, phone, dth_no, type: 'credit', amount: amt, note,
          source_app: 'DTH Accounts', payment_type: r.paidDate ? 'credit' : 'cash',
          created_at: dthDateToIso(r.date)
        });
        out.push({
          id: 'dth_'+row.id+'_paid', srcId: null, readonly: true,
          customer_name: name, phone, dth_no, type: 'debit',
          amount: (r.cashReceived != null ? Number(r.cashReceived) : amt),
          note: settleNote, source_app: 'DTH Accounts', payment_type: 'cash',
          created_at: paidTime
        });
      } else if (row.type === 'advance') {
        // Balance Held ledger from DTH-Accounts: r.type here is the INNER
        // add/use flag (not to be confused with the outer row.type==='advance').
        // 'add'  → customer overpaid, shop now owes them → this is a DEBIT
        //          against what the customer owes (can even push the running
        //          balance negative, meaning the shop holds their money).
        // 'use'  → that held balance was applied toward a new recharge →
        //          a CREDIT that cancels the earlier debit back out, exactly
        //          the way "Balance Held should go back to zero once used"
        //          needs to look in a running ledger.
        const balDate = r.date ? dthDateToIso(r.date) : new Date().toISOString();
        const balNote = r.note || (r.type === 'use' ? 'Balance Held used' : 'Balance Held added');
        if (r.type === 'add') {
          out.push({
            id: 'dth_'+row.id+'_baladd', srcId: null, readonly: true,
            customer_name: name, phone, dth_no, type: 'debit', amount: amt, note: balNote,
            source_app: 'DTH Accounts', payment_type: 'cash', created_at: balDate
          });
        } else if (r.type === 'use') {
          out.push({
            id: 'dth_'+row.id+'_baluse', srcId: null, readonly: true,
            customer_name: name, phone, dth_no, type: 'credit', amount: amt, note: balNote,
            source_app: 'DTH Accounts', payment_type: 'cash', created_at: balDate
          });
        }
      } else {
        // Unrecognized row.type — rather than silently dropping this record,
        // surface it as a flagged ledger entry so it doesn't vanish, and log
        // it so a future dev pass can teach fetchDthRecords about this type.
        console.warn('DTH_RECORDS: unrecognized row type, showing as flagged entry', { id: row.id, type: row.type, data: r });
        out.push({
          id: 'dth_'+row.id+'_unknown', srcId: null, readonly: true,
          customer_name: name, phone, dth_no, type: 'credit', amount: amt,
          note: '⚠️ Unrecognized type: ' + row.type,
          source_app: 'DTH Accounts', payment_type: 'cash',
          created_at: dthDateToIso(r.date) || new Date().toISOString()
        });
      }
    });
    return out;
  }catch(e){ console.warn('DTH_RECORDS auto-pull failed', e); return []; }
}

// Same idea for Recharge Shop's recharge_records table (id, type, data JSON,
// updated_at). type='txn' rows are every sale. payment='credit' → still owed
// (one entry). Everything else — plain 'cash' sales, 'cash' sales that carry
// a paidAt (were credit, now settled), and 'reinvested' sales — gets a
// credit + matching debit pair, same reasoning as DTH above, so every sale
// shows up in the ledger history.
async function fetchRechargeRecords(){
  try{
    // Same pagination fix as DTH_RECORDS — page through in batches of 1000
    // instead of a flat limit(2000).
    const data = [];
    const PAGE = 1000;
    for(let from = 0; ; from += PAGE){
      const { data: page, error } = await sb.from('recharge_records').select('id,type,data,updated_at').range(from, from + PAGE - 1);
      if(error) throw error;
      if(!page || page.length === 0) break;
      data.push(...page);
      if(page.length < PAGE) break;
    }
    const out = [];
    data.forEach(row => {
      if (row.type === 'balance') {
        // Balance Held ledger from Recharge Shop. r.type here is the INNER
        // add/use flag on the balance entry itself (row.type is the outer
        // 'balance' wrapper). Same direction as the DTH-Accounts side:
        // 'add' → shop owes customer (debit), 'use' → cancels that back out
        // (credit) — this is what lets "Balance Held goes to zero once used"
        // actually show up as a closed loop in the ledger.
        const r = row.data || {};
        const name = pick(r, ['customerName','customer_name','cust']) || 'Unknown';
        const phone = pick(r, ['phone','mobile']) || '';
        const amt = Number(r.amount || 0);
        if (amt <= 0) {
          console.warn('recharge_records: skipped balance row with zero/blank amount', { id: row.id, data: r });
          return;
        }
        const balDate = r.date ? new Date(Number(r.date)).toISOString() : new Date().toISOString();
        const balNote = r.note || (r.type === 'use' ? 'Balance Held used' : 'Balance Held added');
        if (r.type === 'add') {
          out.push({
            id: 'rs_'+row.id+'_baladd', srcId: null, readonly: true,
            customer_name: name, phone, type: 'debit', amount: amt, note: balNote,
            source_app: 'Recharge Shop', payment_type: 'cash', created_at: balDate
          });
        } else if (r.type === 'use') {
          out.push({
            id: 'rs_'+row.id+'_baluse', srcId: null, readonly: true,
            customer_name: name, phone, type: 'credit', amount: amt, note: balNote,
            source_app: 'Recharge Shop', payment_type: 'cash', created_at: balDate
          });
        }
        return;
      }
      if (row.type !== 'txn') {
        // Unrecognized row.type (anything other than 'balance'/'txn') — flag
        // it in the ledger instead of silently dropping it, and log so a
        // future dev pass can teach fetchRechargeRecords about this type.
        const r0 = row.data || {};
        const amt0 = Number(pick(r0, ['sell','amount']) || 0);
        if (amt0 <= 0) {
          console.warn('recharge_records: skipped unrecognized row with zero/blank amount', { id: row.id, type: row.type, data: r0 });
          return;
        }
        console.warn('recharge_records: unrecognized row type, showing as flagged entry', { id: row.id, type: row.type, data: r0 });
        out.push({
          id: 'rs_'+row.id+'_unknown', srcId: null, readonly: true,
          customer_name: pick(r0, ['customerName','customer_name','cust']) || 'Unknown',
          phone: pick(r0, ['phone','mobile']) || '',
          type: 'credit', amount: amt0,
          note: '⚠️ Unrecognized type: ' + row.type,
          source_app: 'Recharge Shop', payment_type: 'cash',
          created_at: r0.createdAt ? new Date(Number(r0.createdAt)).toISOString() : new Date().toISOString()
        });
        return;
      }
      const r = row.data || {};
      const name = pick(r, ['customerName','customer_name','cust']) || 'Unknown';
      const phone = pick(r, ['phone','mobile']) || '';
      const amt = Number(pick(r, ['sell','amount']) || 0);
      if (amt <= 0) {
        console.warn('recharge_records: skipped txn row with zero/blank amount', { id: row.id, data: r });
        return;
      }
      const note = r.note || r.walletName || 'Recharge';
      const createdIso = r.createdAt ? new Date(Number(r.createdAt)).toISOString() : new Date().toISOString();
      if (r.payment === 'credit') {
        out.push({
          id: 'rs_'+row.id+'_credit', srcId: null, readonly: true,
          customer_name: name, phone, type: 'credit', amount: amt, note,
          source_app: 'Recharge Shop', payment_type: 'credit', created_at: createdIso
        });
      } else {
        // Every non-credit sale shows up here now, not just ones that were
        // once credit and later settled ('cash' with paidAt). Plain cash
        // sales (no paidAt) and 'reinvested' sales get the same credit+debit
        // pair treatment — both entries land on the sale's own timestamp,
        // so the running balance nets straight back to zero but the sale
        // still appears in the ledger history (search '@cash' finds these).
        const payLabel = r.payment || 'cash';
        const settledAt = (payLabel === 'cash' && r.paidAt) ? new Date(Number(r.paidAt)).toISOString() : createdIso;
        const settleNote = (payLabel === 'cash' && r.paidAt) ? 'Credit Paid' : (payLabel === 'reinvested' ? 'Reinvested Sale' : 'Cash Sale');
        out.push({
          id: 'rs_'+row.id+'_credit', srcId: null, readonly: true,
          customer_name: name, phone, type: 'credit', amount: amt, note,
          source_app: 'Recharge Shop', payment_type: (payLabel === 'cash' && r.paidAt) ? 'credit' : payLabel,
          created_at: createdIso
        });
        out.push({
          id: 'rs_'+row.id+'_paid', srcId: null, readonly: true,
          customer_name: name, phone, type: 'debit',
          amount: (r.cashReceived != null ? Number(r.cashReceived) : amt),
          note: settleNote, source_app: 'Recharge Shop', payment_type: payLabel,
          created_at: settledAt
        });
      }
    });
    return out;
  }catch(e){ console.warn('recharge_records auto-pull failed', e); return []; }
}

// Wallet balances — type='wallet' rows in DTH_RECORDS / recharge_records
// carry the live wallet object as `data` (e.g. {id,name,balance}). We sum
// `balance` per app so the P&L page can show "Available Cash".
//
// IMPORTANT — these are NOT the same currency:
//   • DTH-Accounts wallets are held in INR (₹) — DTH-Accounts itself
//     converts INR → LKR per-transaction using a Buy Rate it manages in
//     Settings. Showing the raw INR number next to Recharge Shop's LKR
//     number (as this page used to do) silently mixed two currencies as if
//     they were one — a customer's ₹500 wallet is NOT the same as ₨500.
//   • Recharge Shop wallets are already LKR-denominated — no conversion
//     needed there.
// dthBuyRate is pulled from the same dth_data blob DTH-Accounts itself
// reads/writes (key='dth_buy_rate'), so the LKR-equivalent shown here always
// tracks whatever rate is currently set in DTH-Accounts' own Settings.
let walletBalanceDth = 0, walletBalanceRs = 0, dthBuyRate = 0, profitDth = 0, profitRs = 0;
async function fetchWalletBalances(){
  try{
    const [dth, rs, rate] = await Promise.all([
      sb.from('DTH_RECORDS').select('type,data').eq('type','wallet').limit(500),
      sb.from('recharge_records').select('type,data').eq('type','wallet').limit(500),
      sb.from('dth_data').select('value').eq('key','dth_buy_rate').maybeSingle()
    ]);
    walletBalanceDth = ((dth.data)||[]).reduce((s,row)=> s + Number((row.data||{}).balance||0), 0);
    walletBalanceRs  = ((rs.data)||[]).reduce((s,row)=> s + Number((row.data||{}).balance||0), 0);
    dthBuyRate = Number((rate.data||{}).value) || 0;
  }catch(e){ console.warn('wallet balance pull failed', e); }
}

// Profit/Loss per app — summed straight from each app's own raw cloud rows
// (credit/cashpend/recharge for DTH, txn for Recharge Shop) using whatever
// `profit` figure that app itself already calculated per sale, so this
// always agrees with each app's own P&L rather than being re-derived here.
async function fetchProfitTotals(){
  try{
    const [dth, rs] = await Promise.all([
      sb.from('DTH_RECORDS').select('type,data').in('type', ['credit','cashpend','recharge']).limit(3000),
      sb.from('recharge_records').select('type,data').eq('type','txn').limit(3000)
    ]);
    profitDth = ((dth.data)||[]).reduce((s,row)=> s + Number((row.data||{}).profit||0), 0);
    profitRs  = ((rs.data)||[]).reduce((s,row)=> s + Number((row.data||{}).profit||0), 0);
  }catch(e){ console.warn('profit totals pull failed', e); }
}

async function syncFromRemote(){
  if(!sb) { setStatus(false); return; }
  await flushPendingDeletes();
  let manual = [];
  let serverOk = false;
  try{
    const { data, error } = await sb.from(TABLE).select("*").order("created_at", {ascending:true});
    if(error) throw error;
    if(data){
      manual = data
        .filter(r => !pendingDeletes.includes(r.src_id || r.id))
        .map(r => ({
          id: r.id, srcId: r.src_id || r.id, readonly:false, _synced:true,
          customer_name: r.customer_name, phone: r.phone,
          type: r.type, amount: Number(r.amount), note: r.note,
          source_app: r.source_app || 'Manual', payment_type: r.payment_type || 'cash',
          created_at: r.created_at
        }));
    }
    serverOk = true;
    setStatus(true);
  }catch(e){
    console.warn("remote sync failed, using local cache", e);
    setStatus(false);
    manual = entries.filter(e=>!e.readonly);
  }

  // Never lose entries typed offline that haven't reached the server yet —
  // keep any local-only manual entry not (yet) present in the server list,
  // and try pushing it again now that we may be back online.
  if(serverOk){
    const serverIds = new Set(manual.map(m=>m.srcId));
    const stillPending = entries.filter(e => !e.readonly && e._synced === false && !serverIds.has(e.srcId));
    manual = [...manual, ...stillPending];
    stillPending.forEach(e => {
      pushEntry(e).then(ok => {
        if(ok){
          const i = entries.findIndex(x=>x.srcId===e.srcId);
          if(i>=0){ entries[i]._synced = true; saveLocal(); }
          updatePendingBadge();
        }
      });
    });
  }

  const [rechargeRows, dthRows] = await Promise.all([
    fetchRechargeRecords(),
    fetchDthRecords(),
    fetchWalletBalances(),
    fetchProfitTotals()
  ]);

  entries = [...manual, ...rechargeRows, ...dthRows];
  saveLocal();
  renderAccountChips();
  render();
  updatePendingBadge();
}

// Resync the moment the device comes back online, instead of waiting for
// the next 30s tick — makes the "will upload later" promise actually true.
window.addEventListener('online', () => { toast('🌐 Internet திரும்பி வந்தது — sync ஆகுது...'); flushPendingDeletes(); syncFromRemote(); if(!_rtLive) startRealtimeSync(); });

// Mobile browsers suspend timers and can drop realtime connections while
// this app is backgrounded (screen lock, app switch, etc.) — without this,
// coming back to the app could show stale data until the next scheduled
// sync happened to land. Force an immediate sync the moment it's visible
// again, matching the same fix already in DTH-Accounts and Recharge Shop.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    flushPendingDeletes(); syncFromRemote();
    if(!_rtLive) startRealtimeSync(); // realtime sockets get dropped by backgrounding — reconnect
  }
});
window.addEventListener('offline', () => { setStatus(false); toast('📴 Offline — entries local-ஆ save ஆகும்'); });

async function pushEntry(entry){
  if(!sb){ return false; }
  try{
    const { error } = await sb.from(TABLE).insert({
      src_id: entry.srcId,
      customer_name: entry.customer_name,
      phone: entry.phone,
      type: entry.type,
      amount: entry.amount,
      note: entry.note,
      source_app: entry.source_app,
      payment_type: entry.payment_type,
      created_at: entry.created_at
    });
    if(error) throw error;
    return true;
  }catch(e){
    console.warn("push failed, will stay local-only", e);
    return false;
  }
}

function setStatus(ok){

/* ================= REALTIME (instant, second-to-second sync) =================
   Manual polling (every N seconds) is a floor, not the sync mechanism —
   real updates arrive over this Supabase Realtime channel the moment DSC
   (DTH_RECORDS) or Recharge Shop (recharge_records) write a row, same
   pattern DTH-Accounts itself already uses (dth_realtime_v2 channel). */
let _rtChannel = null;
let _rtLive = false;
let _rtDebounce = null;
function _debouncedSync(){
  // Coalesce bursts (a bulk save can fire many change events at once)
  // into a single fetch a few hundred ms later, instead of one fetch per row.
  clearTimeout(_rtDebounce);
  _rtDebounce = setTimeout(syncFromRemote, 400);
}
function startRealtimeSync(){
  if(!sb || _rtChannel) return;
  _rtChannel = sb.channel('customer_ledger_rt_v1')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, _debouncedSync)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'DTH_RECORDS' }, _debouncedSync)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'recharge_records' }, _debouncedSync)
    .subscribe((status) => {
      if(status === 'SUBSCRIBED'){
        _rtLive = true;
      } else if(status === 'CLOSED' || status === 'CHANNEL_ERROR'){
        _rtLive = false;
        _rtChannel = null;
        setTimeout(startRealtimeSync, 2000); // auto-reconnect
      }
    });
}

async function saveEntry(){
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const app = document.getElementById("fApp").value;
  const amt = parseFloat(document.getElementById("fAmount").value);
  const note = document.getElementById("fNote").value.trim();
  if(!name){ toast("Customer name போடுங்க"); return; }
  if(!amt || amt <= 0){ toast("சரியான amount போடுங்க"); return; }

  if(editingSrcId){
    const i = entries.findIndex(e=>e.srcId===editingSrcId);
    if(i < 0){ closeModal(); return; }
    entries[i] = {
      ...entries[i],
      customer_name: name, phone, type: currentType, amount: amt, note,
      source_app: app, payment_type: currentPayType,
      _synced: false
    };
    const updated = entries[i];
    saveLocal();
    closeModal();
    renderAccountChips();
    render();
    updatePendingBadge();
    toast("Entry update ஆச்சு (offline-ல வேலை செய்யும்)");
    pushEntryUpdate(updated).then(ok=>{
      if(ok){
        const j = entries.findIndex(e=>e.srcId===updated.srcId);
        if(j>=0){ entries[j]._synced = true; saveLocal(); }
      } else {
        toast("📴 Offline — internet வந்தவுடன் தானா upload ஆகும்");
      }
      updatePendingBadge();
    });
    editingSrcId = null;
    return;
  }

  const entry = {
    id: uid(), srcId: uid(),
    customer_name: name, phone, type: currentType, amount: amt, note,
    source_app: app, payment_type: currentPayType,
    created_at: new Date().toISOString(),
    _synced: false
  };
  entries.push(entry);
  saveLocal();
  closeModal();
  renderAccountChips();
  render();
  updatePendingBadge();
  toast("Entry சேர்க்கப்பட்டது (offline-ல வேலை செய்யும்)");
  pushEntry(entry).then(ok=>{
    if(ok){
      const i = entries.findIndex(e=>e.srcId===entry.srcId);
      if(i>=0){ entries[i]._synced = true; saveLocal(); }
    } else {
      toast("📴 Offline — internet வந்தவுடன் தானா upload ஆகும்");
    }
    updatePendingBadge();
  });
}

async function pushEntryUpdate(entry){
  if(!sb){ return false; }
  try{
    const { error } = await sb.from(TABLE).update({
      customer_name: entry.customer_name,
      phone: entry.phone,
      type: entry.type,
      amount: entry.amount,
      note: entry.note,
      source_app: entry.source_app,
      payment_type: entry.payment_type
    }).eq('src_id', entry.srcId);
    if(error) throw error;
    return true;
  }catch(e){
    console.warn("update push failed, will stay local-only", e);
    return false;
  }
}

function deleteEntry(srcId){
  const e = entries.find(x=>x.srcId===srcId);
  if(!e) return;
  if(e.readonly){
    toast("இது " + (e.source_app||"another app") + "-ல இருந்து வந்தது — அந்த app-லேயே delete பண்ணுங்க");
    return;
  }
  if(!confirm("இந்த entry-ஐ நீக்கணுமா? இது permanent.")) return;
  entries = entries.filter(x=>x.srcId!==srcId);
  saveLocal();
  closeModal();
  renderAccountChips();
  render();
  toast("Entry நீக்கப்பட்டது");

  pendingDeletes.push(srcId);
  savePendingDeletes();
  flushPendingDeletes();
}

async function flushPendingDeletes(){
  if(!sb || pendingDeletes.length === 0) return;
  const still = [];
  for(const srcId of pendingDeletes){
    try{
      const { error } = await sb.from(TABLE).delete().eq('src_id', srcId);
      if(error) throw error;
    }catch(e){
      console.warn("delete push failed, will retry later", e);
      still.push(srcId);
    }
  }
  pendingDeletes = still;
  savePendingDeletes();
}

function renderAccountChips(){
  const names = [...new Set(entries.map(e=>e.customer_name))].sort();
  const row = document.getElementById("acctRow");
  row.innerHTML = '<div class="chip ' + (currentCustomer==="__ALL__"?"active":"") + '" data-cust="__ALL__" onclick="selectCustomer(\'__ALL__\')">All Customers</div>' +
    names.map(n => '<div class="chip ' + (currentCustomer===n?"active":"") + '" onclick="selectCustomer(\''+n.replace(/'/g,"\\'")+'\')">'+n+'</div>').join('');
}
function selectCustomer(name){
  currentCustomer = name;
  renderAccountChips();
  render();
}

function setView(v){
  view = v;
  document.getElementById("vtList").className = "vt-btn" + (v==='list' ? " active":"");
  document.getElementById("vtCust").className = "vt-btn" + (v==='customers' ? " active":"");
  document.getElementById("vtPnl").className = "vt-btn" + (v==='pnl' ? " active":"");
  render();
}

function matchesQuery(e, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  if(q === "@credit" || q === "@credits") return e.type === "credit";
  if(q === "@debit" || q === "@debits") return e.type === "debit";
  if(q === "@cash") return e.payment_type === "cash";
  if(q === "@pending") return e.payment_type === "credit";
  if(q === "@recharge") return e.source_app === "Recharge Shop";
  if(q === "@dth") return e.source_app === "DTH Accounts";
  const hay = (e.customer_name + " " + (e.phone||"") + " " + (e.note||"") + " " + (e.source_app||"") + " " + (e.payment_type||"") + " " + new Date(e.created_at).toLocaleDateString()).toLowerCase();
  return hay.includes(q);
}

function render(){
  const q = document.getElementById("searchBox").value;
  const scoped = currentCustomer === "__ALL__" ? entries : entries.filter(e=>e.customer_name===currentCustomer);

  // running balance always computed over the full scoped set in chronological order
  const chrono = scoped.map(e => ({ e, ts: new Date(e.created_at).getTime() }))
    .sort((a,b) => a.ts - b.ts).map(x => x.e);
  let running = 0;
  const withBalance = chrono.map(e=>{
    running += (e.type === 'credit' ? e.amount : -e.amount);
    return {...e, balance: running};
  });

  const overallBalance = running;
  document.getElementById("balNum").textContent = fmt(overallBalance);
  document.getElementById("balLabel").textContent = currentCustomer==="__ALL__" ? "Overall Balance" : currentCustomer + " Balance";
  document.getElementById("balSub").textContent = scoped.length + " entries";

  const totalDebit = scoped.filter(e=>e.type==='debit').reduce((s,e)=>s+e.amount,0);
  const totalCredit = scoped.filter(e=>e.type==='credit').reduce((s,e)=>s+e.amount,0);
  document.getElementById("footDebit").textContent = fmt(totalDebit);
  document.getElementById("footCredit").textContent = fmt(totalCredit);

  const wrap = document.getElementById("listWrap");

  if(view === 'customers'){
    // Per-customer directory — every customer who has ANY entry, whether
    // they currently owe money (Payable), are fully settled (Paid), or
    // overpaid and are sitting on Advance Cash (shop owes them back).
    // This ignores the account-chip filter on purpose — it's meant to be
    // the one place that shows everyone at a glance.
    const byCust = {};
    entries.forEach(e => {
      if(!byCust[e.customer_name]) byCust[e.customer_name] = { name: e.customer_name, phone: e.phone||'', balance: 0, count: 0, last: 0 };
      const c = byCust[e.customer_name];
      c.balance += (e.type === 'credit' ? e.amount : -e.amount);
      c.count++;
      if(!c.phone && e.phone) c.phone = e.phone;
      const ts = new Date(e.created_at).getTime();
      if(ts > c.last) c.last = ts;
    });
    let list = Object.values(byCust).filter(c => matchesQuery({customer_name:c.name, phone:c.phone, note:'', source_app:'', payment_type:'', type:'', created_at:new Date(c.last).toISOString()}, q));
    // Payable (still owe) first — highest first, then Advance (we owe them), then fully settled
    list.sort((a,b) => {
      const grp = c => c.balance > 0.004 ? 0 : (c.balance < -0.004 ? 1 : 2);
      const ga = grp(a), gb = grp(b);
      if(ga !== gb) return ga - gb;
      return Math.abs(b.balance) - Math.abs(a.balance);
    });
    const payableTotal = list.filter(c=>c.balance>0.004).reduce((s,c)=>s+c.balance,0);
    const advanceTotal = list.filter(c=>c.balance<-0.004).reduce((s,c)=>s+Math.abs(c.balance),0);
    const paidCount = list.filter(c=>Math.abs(c.balance)<=0.004).length;

    wrap.innerHTML =
      `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <div style="flex:1;min-width:110px;background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);">
          <div style="font-size:10.5px;opacity:.65;">Payable (owe us)</div>
          <div style="font-weight:700;color:var(--credit);font-size:16px;">${fmt(payableTotal)}</div>
        </div>
        <div style="flex:1;min-width:110px;background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);">
          <div style="font-size:10.5px;opacity:.65;">Advance (we owe)</div>
          <div style="font-weight:700;color:var(--debit);font-size:16px;">${fmt(advanceTotal)}</div>
        </div>
        <div style="flex:1;min-width:110px;background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);">
          <div style="font-size:10.5px;opacity:.65;">Paid / Settled</div>
          <div style="font-weight:700;font-size:16px;">${paidCount}</div>
        </div>
      </div>` +
      list.map(c => {
        const isPayable = c.balance > 0.004, isAdvance = c.balance < -0.004;
        const status = isPayable ? 'PAYABLE' : (isAdvance ? 'ADVANCE' : 'PAID');
        const color = isPayable ? 'var(--credit)' : (isAdvance ? 'var(--debit)' : 'var(--ink-soft)');
        return `<div class="entry" onclick="selectCustomer('${c.name.replace(/'/g,"\\'")}'); setView('list');" style="cursor:pointer;">
          <div class="entry-left">
            <div class="entry-name">${escapeHtml(c.name)}${c.phone? ' · '+escapeHtml(c.phone):''}</div>
            <div class="entry-meta">${c.count} entries · <span style="color:${color};font-weight:700;">${status}</span></div>
          </div>
          <div class="entry-right">
            <div class="entry-amt" style="color:${color};">${fmt(Math.abs(c.balance))}</div>
            <div class="entry-bal">${isPayable ? 'still owes' : (isAdvance ? 'paid extra' : 'settled')}</div>
          </div>
        </div>`;
      }).join('') || '<div class="empty"><b>இன்னும் customer இல்ல</b></div>';
    return;
  }

  if(view === 'pnl'){
    const todayStr = new Date().toDateString();
    const todayEntries = scoped.filter(e => new Date(e.created_at).toDateString() === todayStr);
    const todayDebit = todayEntries.filter(e=>e.type==='debit').reduce((s,e)=>s+e.amount,0);
    const todayCredit = todayEntries.filter(e=>e.type==='credit').reduce((s,e)=>s+e.amount,0);

    const byApp = {};
    scoped.forEach(e=>{
      const app = e.source_app || 'Manual';
      if(!byApp[app]) byApp[app] = {credit:0, debit:0};
      if(e.type==='credit') byApp[app].credit += e.amount; else byApp[app].debit += e.amount;
    });

    const row = (label, val, color) => `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--paper-line);">
      <span style="color:var(--ink-soft);font-size:13.5px;">${label}</span>
      <span style="font-weight:700;font-family:'JetBrains Mono',monospace;color:${color};">${fmt(val)}</span>
    </div>`;
    const card = (title, inner) => `<div style="background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);">
      <div style="font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:4px;">${title}</div>
      ${inner}
    </div>`;

    const appCards = Object.keys(byApp).map(app => {
      const net = byApp[app].credit - byApp[app].debit;
      return card('📱 ' + escapeHtml(app),
        row('Credit Given', byApp[app].credit, 'var(--credit)') +
        row('Cash Collected', byApp[app].debit, 'var(--debit)') +
        row('Net Outstanding', net, net>=0 ? 'var(--credit)' : 'var(--debit)'));
    }).join('');

    const walletCard = card('💰 Wallet Status',
      `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--paper-line);">
        <span style="color:var(--ink-soft);font-size:13.5px;">DTH Accounts Wallet (₹ INR)</span>
        <span style="font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--credit);">₹${walletBalanceDth.toFixed(2)}</span>
      </div>` +
      (dthBuyRate > 0
        ? row('→ LKR Value (Buy Rate ×' + dthBuyRate.toFixed(2) + ')', walletBalanceDth * dthBuyRate, 'var(--ink-soft)')
        : `<div style="padding:6px 0;font-size:11.5px;color:var(--ink-soft);">⚠️ Buy Rate not found — LKR value unavailable</div>`) +
      row('Recharge Shop Wallet (LKR — already native)', walletBalanceRs, 'var(--credit)') +
      row('Total Available Cash (LKR)', (dthBuyRate > 0 ? walletBalanceDth * dthBuyRate : 0) + walletBalanceRs, 'var(--ink)'));

    const profitCard = card('📈 Profit / Loss (LKR)',
      row('DTH Accounts Profit', profitDth, profitDth >= 0 ? 'var(--credit)' : 'var(--debit)') +
      row('Recharge Shop Profit', profitRs, profitRs >= 0 ? 'var(--credit)' : 'var(--debit)') +
      row('Combined Profit', profitDth + profitRs, (profitDth + profitRs) >= 0 ? 'var(--credit)' : 'var(--debit)'));

    wrap.innerHTML =
      card('📅 Today', row('Credit Given', todayCredit, 'var(--credit)') + row('Cash Collected', todayDebit, 'var(--debit)') + row('Net Change', todayCredit-todayDebit, (todayCredit-todayDebit)>=0?'var(--credit)':'var(--debit)')) +
      profitCard +
      card('📈 All Time', row('Total Credit Given', totalCredit, 'var(--credit)') + row('Total Cash Collected', totalDebit, 'var(--debit)') + row('Outstanding Balance', overallBalance, overallBalance>=0?'var(--credit)':'var(--debit)')) +
      walletCard +
      appCards +
      `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;padding:0 4px;">இது credit/debit summary — cost/profit margin இங்க track ஆகல், அது DTH Accounts / Recharge Shop app-ஓட own P&amp;L page-ல பாருங்க.</div>`;
    return;
  }

  // filter + newest first for display
  const filtered = withBalance.filter(e=>matchesQuery(e,q)).reverse();

  if(filtered.length === 0){
    wrap.innerHTML = '<div class="empty"><b>இன்னும் entry இல்ல</b>Debit அல்லது Credit பட்டன் அழுத்தி முதல் entry சேருங்க.</div>';
    return;
  }

  if(view === 'list'){
    wrap.innerHTML = filtered.map((e,i)=>{
      const dt = new Date(e.created_at);
      const dateStr = dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
      const timeStr = dt.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      return `<div class="entry" onclick="openEntryActions('${e.srcId}')" style="cursor:pointer;">
        <div class="entry-left">
          <div class="entry-id">#${String(withBalance.length - i).padStart(4,'0')}${e.readonly?' 🔒':''}</div>
          <div class="entry-name">${escapeHtml(e.customer_name)}${e.phone? ' · '+escapeHtml(e.phone):''}</div>
          <div class="entry-meta">${dateStr} ${timeStr} · ${escapeHtml(e.source_app||'Manual')} · ${e.payment_type==='credit'?'CREDIT':'CASH'}${e.note? ' · '+escapeHtml(e.note):''}</div>
        </div>
        <div class="entry-right">
          <div class="entry-amt ${e.type}">${e.type==='debit'?'−':'+'}${fmt(e.amount)}</div>
          <div class="entry-bal">Bal ${fmt(e.balance)}</div>
        </div>
      </div>`;
    }).join('');
  } else {
    wrap.innerHTML = `<div style="overflow-x:auto;"><table class="sheet">
      <tr><th>Date</th><th>Time</th><th>Name</th><th>Number</th><th>Dth Number</th><th>Credit</th><th>Debit</th></tr>
      ${filtered.map((e,i)=>{
        const dt = new Date(e.created_at);
        const dateStr = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
        const timeStr = dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
        const nameCell = `${escapeHtml(e.customer_name)}${e.readonly?' 🔒':''}`;
        return `<tr onclick="openEntryActions('${e.srcId}')" style="cursor:pointer;">
          <td>${dateStr}</td>
          <td>${timeStr}</td>
          <td>${nameCell}</td>
          <td>${escapeHtml(e.phone||'')}</td>
          <td>${escapeHtml(e.dth_no||'')}</td>
          <td class="c">${e.type==='credit'?fmt(e.amount):''}</td>
          <td class="d">${e.type==='debit'?fmt(e.amount):''}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  }
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function shareLedger(){
  const q = document.getElementById("searchBox").value;
  const scoped = currentCustomer === "__ALL__" ? entries : entries.filter(e=>e.customer_name===currentCustomer);
  const chrono = scoped.map(e => ({ e, ts: new Date(e.created_at).getTime() }))
    .sort((a,b) => a.ts - b.ts).map(x => x.e);
  let running = 0;
  const rows = chrono.map(e=>{ running += (e.type==='credit'?e.amount:-e.amount); return {...e, balance:running}; })
    .filter(e=>matchesQuery(e,q)).reverse();

  let text = `Customer Ledger - ${currentCustomer==="__ALL__"?"All Customers":currentCustomer}\n`;
  text += `Balance: ${fmt(running)}\n\n`;
  rows.slice(0,50).forEach(e=>{
    const dt = new Date(e.created_at).toLocaleDateString('en-GB');
    text += `${dt}  ${e.customer_name}  ${e.type==='debit'?'-':'+'}${fmt(e.amount)}  Bal:${fmt(e.balance)}\n`;
  });

  if(navigator.share){
    try{ await navigator.share({title:"Customer Ledger", text}); return; }catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text);
    toast("Clipboard-க்கு copy ஆச்சு");
  }catch(e){
    toast("Share செய்ய முடியல");
  }
}

loadLocal();
renderAccountChips();
render();
updatePendingBadge();
flushPendingDeletes();
syncFromRemote();
startRealtimeSync();
// Fallback poll only — real sync now happens instantly over the realtime
// channel above. This just catches the rare case where the socket is down.
setInterval(() => { if(!_rtLive) syncFromRemote(); }, 15000);
</script>
